# .github/workflows/ci.yml
name: CI - Tests & Quality

on:
  push:
    branches: [ main, develop, feature/* ]
  pull_request:
    branches: [ main, develop ]

jobs:
  # =============================================
  # 1. Code Quality & Security (fast, non-blocking)
  # =============================================
  quality:
    name: Code Quality & Security
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install quality tools
        run: |
          python -m pip install --upgrade pip
          pip install black isort flake8 bandit

      - name: Black — Check formatting
        run: black --check --diff app.py tests/ conftest.py || true

      - name: isort — Check import order
        run: isort --check-only --diff app.py tests/ conftest.py || true

      - name: Flake8 — Lint
        run: flake8 app.py tests/ --max-line-length=120 --ignore=E501,W503 || true

      - name: Bandit — Security scan
        continue-on-error: true
        run: |
          bandit -r app.py tests/ -f html -o bandit-report.html

      - name: Upload security report
        uses: actions/upload-artifact@v4
        with:
          name: security-report
          path: bandit-report.html
          if-no-files-found: ignore

  # =============================================
  # 2. Unit + Integration Tests (with coverage)
  # =============================================
  tests:
    name: Tests (Python ${{ matrix.py }})
    runs-on: ubuntu-latest
    needs: quality
    strategy:
      matrix:
        py: ['3.10', '3.11']   # 3.9 is very old in 2025, dropped

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.py }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.py }}
          cache: 'pip'

      - name: Install dependencies + test tools
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-cov

      - name: Run pytest with coverage
        run: |
          pytest -v \
            --cov=app \
            --cov-report=term-missing \
            --cov-report=html:coverage-html

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-py${{ matrix.py }}
          path: coverage-html

  # =============================================
  # 3. End-to-End Selenium Test (Headless Chrome)
  # =============================================
  e2e:
    name: E2E — Selenium
    runs-on: ubuntu-latest
    needs: tests

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      # Reliable & up-to-date Chrome + Driver setup (2025 method)
      - name: Install Chrome + ChromeDriver (100% compatible)
        uses: nanasess/setup-chromedriver@master
        with:
          chromedriver-version: 'stable'

      - name: Run ChromeDriver
        run: |
          chromedriver --url-base=/wd/hub &

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Selenium End-to-End Test
        run: python test_functional_selenium.py

      # Optional: take screenshot if test fails
      - name: Take screenshot on failure
        if: failure()
        run: echo "Test failed — you can add screenshot logic here"

      - name: Upload page source on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-failure-page-source
          path: page-source.html   # if you save driver.page_source
          if-no-files-found: ignore