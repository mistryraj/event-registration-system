name: CI - Tests & Quality

on:
  push:
    branches: [ main, develop, feature/* ]
  pull_request:
    branches: [ main, develop ]

jobs:
  quality:
    name: Code Quality & Security
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install tools
        run: pip install black isort flake8 bandit
      
      # We group these and use 'continue-on-error' so one failure doesn't stop the others
      # but we still get to see the output.
      - name: Check Formatting (Black)
        continue-on-error: true
        run: black --check --diff .
        
      - name: Check Imports (Isort)
        continue-on-error: true
        run: isort --check-only --diff .
        
      - name: Linting (Flake8)
        continue-on-error: true
        run: flake8 .
        
      - name: Security Scan (Bandit)
        continue-on-error: true
        run: bandit -r . -f text

  tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run Unit Tests
        run: pytest -v --ignore=test_functional_selenium.py
        # We ignore the selenium file here so it doesn't run twice

  e2e:
    name: E2E - Selenium
    runs-on: ubuntu-latest
    needs: tests
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      
      # Note: We DO NOT need to sudo apt-get install chrome.
      # It is pre-installed on ubuntu-latest.
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          
      - name: Run Selenium Test
        # We set headless mode explicitly via environment variable if needed, 
        # but your script handles it via options.
        run: python test_functional_selenium.py