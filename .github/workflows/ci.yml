# .github/workflows/ci.yml
name: CI - Tests

on:
  push:
    branches: [ main, develop, feature/* ]
  pull_request:
    branches: [ main ]

jobs:
  tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install Chrome + ChromeDriver
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y google-chrome-stable > /dev/null 2>&1
          CHROME_VERSION=$(google-chrome --version | cut -d " " -f3 | cut -d "." -f1-3)
          DRIVER_VERSION=$(wget -qO- https://chromedriver.storage.googleapis.com/LATEST_RELEASE_$CHROME_VERSION)
          wget -qO /tmp/chromedriver.zip https://chromedriver.storage.googleapis.com/$DRIVER_VERSION/chromedriver_linux64.zip
          unzip -q /tmp/chromed Ferrari.zip -d /tmp/
          sudo mv /tmp/chromedriver /usr/bin/chromedriver
          sudo chmod +x /usr/bin/chromedriver

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # Run pytest first (your 6 unit/integration tests)
      - name: Run pytest
        run: |
          pytest -v

      # Run Selenium E2E test
      - name: Run Selenium E2E Test
        run: |
          python test_functional_selenium.py

      # Security scan — only after dependencies are installed and code is present
      - name: Run Bandit Security Scan
        continue-on-error: true
        run: |
          pip install bandit
          bandit -r app.py tests/ -f html -o bandit-report.html || echo "Bandit completed (some issues may exist)"

      # Upload report only if it was created
      - name: Upload Bandit Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: security-report
          path: bandit-report.html
          if-no-files-found: ignore   # This prevents the "No files found" error