# .github/workflows/ci.yml
name: CI - Tests

on:
  push:
    branches: [ main, develop, feature/* ]
  pull_request:
    branches: [ main ]

jobs:
  tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      # ─── BEST & MOST RELIABLE METHOD IN 2025 ───
      - name: Set up Chrome (official action)
        uses: browser-actions/setup-chrome@v1
        with:
          chrome-version: stable

      - name: Set up matching ChromeDriver (bulletproof)
        run: |
          # This action puts chrome in a custom path → use its output
          CHROME_PATH=$(which chrome || which google-chrome || echo "/tmp/chrome-linux/chrome")
          CHROME_VERSION=$("$CHROME_PATH" --version | grep -oE '[0-9]+\.[0-9]+\.[0-9]+' | head -1)
          echo "Detected Chrome version: $CHROME_VERSION"
          
          DRIVER_VERSION=$(curl -s https://chromedriver.storage.googleapis.com/LATEST_RELEASE_$CHROME_VERSION)
          echo "Downloading ChromeDriver version: $DRIVER_VERSION"
          
          curl -sSL https://chromedriver.storage.googleapis.com/$DRIVER_VERSION/chromedriver_linux64.zip -o /tmp/chromedriver.zip
          unzip -q /tmp/chromedriver.zip -d /tmp/
          sudo mv /tmp/chromedriver /usr/bin/chromedriver
          sudo chmod +x /usr/bin/chromedriver

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run pytest (all your unit/integration tests)
        run: pytest -v

      - name: Run Selenium End-to-End Test
        run: python test_functional_selenium.py

      - name: Security Scan (Bandit) - non-blocking
        continue-on-error: true
        run: |
          pip install bandit
          bandit -r app.py tests/ -f html -o bandit-report.html || true

      - name: Upload Security Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: security-report
          path: bandit-report.html
          if-no-files-found: ignore