# .github/workflows/ci.yml
name: CI - Tests

on:
  push:
    branches: [ main, develop, feature/* ]
  pull_request:
    branches: [ main ]

jobs:
  tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install Chrome + ChromeDriver (auto-matched version)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y google-chrome-stable > /dev/null 2>&1
          CHROME_VERSION=$(google-chrome --version | grep -oE '[0-9]+\.[0-9]+\.[0-9]+' | head -1)
          DRIVER_VERSION=$(wget -qO- "https://chromedriver.storage.googleapis.com/LATEST_RELEASE_$CHROME_VERSION" -)
          wget -qO /tmp/chromedriver.zip https://chromedriver.storage.googleapis.com/$DRIVER_VERSION/chromedriver_linux64.zip
          unzip -q /tmp/chromedriver.zip -d /tmp/
          sudo mv /tmp/chromedriver /usr/bin/chromedriver
          sudo chmod +x /usr/bin/chromedriver

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Unit & Integration Tests (pytest)
        run: |
          pytest -v

      - name: Run Selenium End-to-End Test (Headless)
        run: |
          python test_functional_selenium.py

      - name: Security Scan with Bandit (optional, non-blocking)
        continue-on-error: true
        run: |
          pip install bandit
          bandit -r . -f html -o bandit-report.html || echo "Bandit found issues (non-blocking)"

      - name: Upload Bandit Security Report
        if: always()
        uses: actions/upload-artifact@v4   # ← Fixed to v4
        with:
          name: security-report
          path: bandit-report.html
          retention-days: 7