<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Event Details</title>
    <style>
        body { font-family: sans-serif; padding: 20px; }
        .container { max-width: 700px; margin: auto; }
        .event-header { border-bottom: 2px solid #eee; padding-bottom: 10px; }
        .event-header h1 { margin-bottom: 5px; }
        .event-header small { color: #007bff; font-weight: bold; }
        .registration-form { background-color: #f9f9f9; border: 1px solid #ccc; padding: 20px; border-radius: 8px; margin-top: 20px; }
        div { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; }
        input { width: 100%; padding: 8px; box-sizing: border-box; }
        button { padding: 10px 15px; background-color: #28a745; color: white; border: none; }
        a { color: #007bff; }
    </style>
</head>
<body>
    <div class="container">
        <a href="/">&larr; Back to all events</a>
        
        <div class="event-header">
            <h1>{{ event.title }}</h1>
            <small>Date: {{ event.event_date }}</small>
            <p>{{ event.description }}</p>
        </div>

        <div class="registration-form">
            <h2>Register for this Event</h2>
            <form action="{{ url_for('register', event_id=event.id) }}" method="POST">
                <div>
                    <label for="name">Your Name:</label>
                    <input type="text" id="name" name="name" required>
                </div>
                <div>
                    <label for="email">Your Email:</label>
                    <input type="email" id="email" name="email" required>
                </div>
                <button type="submit">Register</button>
            </form>
        </div>

    </div>
</body>
</html>
